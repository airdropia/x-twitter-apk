name: Release - manual 

on:
workflow_dispatch:
inputs:
version_input:
description: 'Enter the version (12.17.0-release.0)'
required: true
default: '12.17.0' 

permissions:
contents: write 

jobs:
build:
runs-on: ubuntu-latest 

steps:

* uses: actions/checkout@v4
* name: Set up java
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '21'
* name: Install uv
uses: astral-sh/setup-uv@v5
with:
python-version: "3.13"
enable-cache: true
* name: Install dependencies
run: uv sync --frozen
* name: Try building
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
run: |
mkdir -p bins
uv run main.py --m 1 --v ${{ github.event.inputs.version_input }}
* name: Upload Patched APK as Artifact
uses: actions/upload-artifact@v4
with:
name: Twitter-Piko-${{ github.event.inputs.version_input }}
path: bins/**/*.apk
